[package]
name = "yutu-desktop"
version = "0.2.1"
edition = "2021"
description = "Desktop integration: MPRIS, tray hints, media keys (yutu-mux)"
license = "MIT"

[dependencies]
yutu-core = { path = "../yutu-core" }
zbus = "5"
# Hyprland window control (`hyprctl clients -j` parsing).
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }

# macOS media keys + Now Playing via souvlaki (MPNowPlayingInfoCenter /
# MPRemoteCommandCenter). Target-gated: other platforms never compile it.
[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.8"
# Mini player resize: pin the Metal layer's contents gravity
# (`macos_window.rs`). Same versions iced/wgpu already pull in.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
raw-window-handle = "0.6"

# Windows media keys + SMTC via souvlaki (SystemMediaTransportControls).
# The hidden HWND owner is created with the `windows` crate (same 0.44
# line souvlaki uses, so no extra major version enters the tree).
[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = "0.8"
windows = { version = "0.44", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }
# Mini player: rounded corners on its opaque window (`windows_window.rs`).
raw-window-handle = "0.6"
