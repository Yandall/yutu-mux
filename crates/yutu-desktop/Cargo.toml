[package]
name = "yutu-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop integration: MPRIS, tray hints, media keys (yutu-mux)"
license = "MIT"

[dependencies]
yutu-core = { path = "../yutu-core" }
zbus = "5"
tokio = { version = "1", features = ["rt", "macros", "time"] }

# macOS media keys + Now Playing via souvlaki (MPNowPlayingInfoCenter /
# MPRemoteCommandCenter). Target-gated: other platforms never compile it.
[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.8"
