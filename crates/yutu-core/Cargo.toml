[package]
name = "yutu-core"
version = "0.1.0"
edition = "2021"
description = "Models, backend trait, mock fixtures, auth + cache (yutu-mux)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = "0.32"
md5 = "0.8"
ytmapi-rs = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
reqwest = { version = "0.13", default-features = false, features = [
    "default-tls",
    "json",
    "form",
], optional = true }

[features]
innertube = ["dep:ytmapi-rs", "dep:tokio", "dep:reqwest"]
lyrics = ["dep:reqwest", "dep:tokio"]
submit = ["dep:reqwest", "dep:tokio"]

