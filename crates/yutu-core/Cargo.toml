[package]
name = "yutu-core"
version = "0.1.0"
edition = "2021"
description = "Models, backend trait, auth + cache (yutu-mux)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = "0.32"
md5 = "0.8"
sha1 = { version = "0.10", optional = true }
# Exact pin: `ytm_token` implements the public `AuthToken` + `LoggedIn`
# traits, so an upstream 0.3.x that seals them or reshapes the public
# surface must be adopted deliberately, never by a blind update.
ytmapi-rs = { version = "=0.3.3", optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
futures = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = [
    "default-tls",
    "json",
    "form",
], optional = true }

[features]
innertube = ["dep:ytmapi-rs", "dep:tokio", "dep:reqwest", "dep:futures", "dep:sha1"]
lyrics = ["dep:reqwest", "dep:tokio"]
submit = ["dep:reqwest", "dep:tokio"]
# Test-only mock backend + fixtures (never in release binaries): enabled
# via dev-dependencies by crates whose tests use `MockBackend`.
test-fixtures = []

