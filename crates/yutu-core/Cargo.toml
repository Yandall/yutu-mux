[package]
name = "yutu-core"
version = "0.1.0"
edition = "2021"
description = "Models, backend trait, auth + cache (yutu-mux)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# `bundled-windows` links a static SQLite only on Windows targets (no
# SQLite DLL to ship in the self-contained Windows package); Unix builds
# keep using the system library installed via packaging/install.sh.
rusqlite = { version = "0.32", features = ["bundled-windows"] }
md5 = "0.8"
sha1 = { version = "0.10", optional = true }
# Exact pin: `ytm_token` implements the public `AuthToken` + `LoggedIn`
# traits, so an upstream 0.3.x that seals them or reshapes the public
# surface must be adopted deliberately, never by a blind update.
ytmapi-rs = { version = "=0.3.3", optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
futures = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = [
    "default-tls",
    "json",
    "form",
], optional = true }
# Pure-Rust file work for self-updates (checksum, tarball): exact pins
# per deny.toml (wildcards denied), licenses MIT/Apache-2.0.
sha2 = { version = "=0.11.1", optional = true }
flate2 = { version = "=1.1.10", optional = true }
tar = { version = "=0.4.46", optional = true }
# OS keychain for cookie sessions + scrobble tokens (Secret Service on
# Linux, Keychain on macOS, Credential Manager on Windows). Unconditional:
# scrobbling persistence is not feature-gated, and headless machines use
# the keychain-error paths (no compile-time system deps on Linux).
keyring = "4"

[features]
innertube = ["dep:ytmapi-rs", "dep:tokio", "dep:reqwest", "dep:futures", "dep:sha1"]
lyrics = ["dep:reqwest", "dep:tokio"]
submit = ["dep:reqwest", "dep:tokio"]
# Self-update check (latest GitHub release tag vs this build) plus the
# download/verify/install machinery behind "Update and restart".
# Pure-Rust file work only (no system link): offline builds keep none
# of it (see the `update` feature gate in update.rs).
update = ["dep:reqwest", "dep:tokio", "dep:sha2", "dep:flate2", "dep:tar"]
# Test-only mock backend + fixtures (never in release binaries): enabled
# via dev-dependencies by crates whose tests use `MockBackend`.
test-fixtures = []

