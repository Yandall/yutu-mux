[package]
name = "yutu-ui"
version = "0.1.0"
edition = "2021"
description = "Iced app shell (yutu-mux) — native UI, no webview"
license = "MIT"

[dependencies]
yutu-core = { path = "../yutu-core" }
yutu-player = { path = "../yutu-player" }
yutu-desktop = { path = "../yutu-desktop" }
iced = { version = "0.14", features = ["tokio"] }

[features]
default = ["submit"]
innertube = ["yutu-core/innertube"]
submit = ["yutu-core/submit"]
