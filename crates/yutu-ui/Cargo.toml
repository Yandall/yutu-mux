[package]
name = "yutu-ui"
version = "0.1.0"
edition = "2021"
description = "Iced app shell (yutu-mux): native UI, no webview"
license = "MIT"

[dependencies]
yutu-core = { path = "../yutu-core" }
yutu-player = { path = "../yutu-player" }
yutu-desktop = { path = "../yutu-desktop" }
iced = { version = "0.14", features = ["tokio", "image", "svg", "advanced", "canvas"] }
# Trait bounds for the pointing-slider wrapper (mirrors iced's Slider).
num-traits = "0.2"
# System font enumeration for the Settings family picker (same
# database iced resolves names through, so every row renders).
fontdb = "0.23"
# tokio rt: the system font scan runs on a blocking thread at startup.
tokio = { version = "1", features = ["time", "sync", "rt"] }
futures = "0.3"
serde_json = "1"

[features]
# Default is the real app: live search/radio + scrobble submission + mpv
# playback (seek/position/EQ). `--no-default-features` is the offline
# compile check (empty states, rodio-only).
default = ["submit", "innertube", "mpv", "lyrics"]
innertube = ["yutu-core/innertube"]
submit = ["yutu-core/submit"]
mpv = ["yutu-player/mpv"]
lyrics = ["yutu-core/lyrics"]
# Opt-in debug UI in any build (error panel, cache census, full status
# text): `cargo run --features debug-panel`. Debug builds show it
# without the flag; release builds hide it without the flag.
debug-panel = []

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
yutu-core = { path = "../yutu-core", features = ["test-fixtures"] }
