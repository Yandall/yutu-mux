[package]
name = "yutu-ui"
version = "0.1.0"
edition = "2021"
description = "Iced app shell (yutu-mux) — native UI, no webview"
license = "MIT"

[dependencies]
yutu-core = { path = "../yutu-core" }
yutu-player = { path = "../yutu-player" }
yutu-desktop = { path = "../yutu-desktop" }
iced = { version = "0.14", features = ["tokio"] }

[features]
# Default is the real app: live search/radio + scrobble submission.
# `--no-default-features` is the offline compile check (empty states).
default = ["submit", "innertube"]
innertube = ["yutu-core/innertube"]
submit = ["yutu-core/submit"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
