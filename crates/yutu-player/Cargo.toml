[package]
name = "yutu-player"
version = "0.1.0"
edition = "2021"
description = "Queue state machine + audio backend trait (yutu-mux)"
license = "MIT"

[dependencies]
yutu-core = { path = "../yutu-core" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }
tokio = { version = "1", features = ["rt", "macros"] }
libmpv2 = { version = "6", optional = true, default-features = false }

[features]
mpv = ["dep:libmpv2"]

[dev-dependencies]
serde_json = "1"
