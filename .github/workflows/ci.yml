name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps (ALSA for rodio/cpal, Wayland+X11 for iced/winit, libmpv for default playback)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libx11-dev libwayland-dev libxkbcommon-dev libmpv-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  mac-check:
    # The macOS driver (Now Playing + media keys) never compiles on the
    # Linux job above: check + clip + test it natively here (no system
    # deps needed; linking never runs for check/clip, tests are pure).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --target aarch64-apple-darwin --all-targets -- -D warnings
      - run: cargo test -p yutu-desktop
