name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  linux-tarball:
    name: linux x86_64 tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps (ALSA for rodio/cpal, Wayland+X11 for iced/winit, libmpv for mpv backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libx11-dev libwayland-dev libxkbcommon-dev libmpv-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace --locked
      - name: Feature checks (innertube + submit + mpv compile)
        run: |
          cargo check --workspace --all-features --locked
          pkg-config --modversion mpv
          cargo check -p yutu-player --features mpv --locked
      - name: Build portable tarball
        run: packaging/linux/build-tarball.sh --output dist
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/*.tar.gz
            dist/*/*.tar.gz.sha256
  macos-dmg:
    name: macOS arm64 disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deps (libmpv headers, dylibbundler for the self-contained bundle)
        run: brew install mpv pkg-config dylibbundler
      - uses: dtolnay/rust-toolchain@stable
      - name: Build self-contained app and disk image
        run: packaging/macos/build-app.sh --self-contained --output dist
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/*.dmg
            dist/*/*.dmg.sha256
  windows-zip-setup:
    name: windows x86_64 zip + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup (installer builder only)
        run: choco install innosetup --no-progress -y
      - name: Fetch mpv dev package (link + run tests)
        shell: pwsh
        run: |
          # The Test step below links libmpv (default features), but the
          # runner ships no mpv: fetch the same dev package the bundle
          # script uses (pin parsed from it, single source of truth),
          # resolve or generate mpv.lib for the linker, and put the DLL
          # dir on PATH so mpv-linked tests can also run.
          $script = Get-Content packaging/windows/build-windows.ps1 -Raw
          $tag = ([regex]::Match($script, '\[string\]\$MpvTag = "([^"]+)"')).Groups[1].Value
          $commit = ([regex]::Match($script, '\[string\]\$MpvCommit = "([^"]+)"')).Groups[1].Value
          if (-not $tag -or -not $commit) { throw "could not read mpv pin from build-windows.ps1" }
          $tmp = Join-Path $env:RUNNER_TEMP "mpv-dev-test"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$tag/mpv-dev-x86_64-$tag-git-$commit.7z"
          Invoke-WebRequest -Uri $url -OutFile "$tmp\mpv-dev.7z" -UseBasicParsing
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe" }
          & $sevenZip x "$tmp\mpv-dev.7z" "-o$tmp\mpv-dev" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed to unpack the mpv dev package" }
          $lib = Get-ChildItem -Path "$tmp\mpv-dev" -Filter "mpv.lib" -Recurse | Select-Object -First 1
          if ($lib) {
            $libDir = $lib.DirectoryName
          } else {
            # Same dumpbin/lib generation as build-windows.ps1: the dev
            # package ships a MinGW import lib, MSVC needs mpv.lib.
            $dll = Get-ChildItem -Path "$tmp\mpv-dev" -Filter "libmpv-2.dll" -Recurse | Select-Object -First 1
            if (-not $dll) { throw "mpv dev package has no libmpv-2.dll" }
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $bindir = Split-Path (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" 2>$null | Select-Object -First 1) -Parent
            if (-not $bindir) { throw "dumpbin.exe not found (needs Visual Studio Build Tools)" }
            $genDir = Join-Path $tmp "mpv-genlib"
            New-Item -ItemType Directory -Path $genDir -Force | Out-Null
            & "$bindir\dumpbin.exe" /exports $dll.FullName "/out:$genDir\mpv-exports.txt" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed" }
            $names = @()
            $inTable = $false
            foreach ($line in (Get-Content "$genDir\mpv-exports.txt")) {
              if (-not $inTable) {
                if ($line -match "ordinal\s+hint\s+RVA\s+name") { $inTable = $true }
                continue
              }
              $t = $line.Trim()
              if ($t -eq "" -or $t -match "Summary") { break }
              $parts = ($t -split "\s+")
              if ($parts.Count -ge 4 -and $parts[0] -match "^\d+$") { $names += $parts[3] }
            }
            if ($names.Count -eq 0) { throw "no exports parsed from libmpv-2.dll" }
            $def = "LIBRARY libmpv-2`r`nEXPORTS`r`n" + ($names -join "`r`n") + "`r`n"
            [IO.File]::WriteAllText("$genDir\mpv.def", $def, [Text.UTF8Encoding]::new($false))
            & "$bindir\lib.exe" "/def:$genDir\mpv.def" "/out:$genDir\mpv.lib" /machine:x64 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "lib.exe failed to create mpv.lib" }
            $libDir = $genDir
          }
          $tail = if ($env:LIB) { ";$env:LIB" } else { "" }
          "LIB=$libDir$tail" >> $env:GITHUB_ENV
          $dllDir = (Get-ChildItem -Path "$tmp\mpv-dev" -Filter "libmpv-2.dll" -Recurse | Select-Object -First 1).DirectoryName
          $dllDir >> $env:GITHUB_PATH
      - name: Test
        run: cargo test --workspace --locked
      - name: Feature checks (innertube + submit + mpv compile)
        run: |
          cargo check --workspace --all-features --locked
          cargo check -p yutu-player --features mpv --locked
      - name: Build self-contained staged zip (mpv DLLs + yt-dlp.exe beside the exe)
        shell: pwsh
        run: packaging/windows/build-windows.ps1 --output dist
      - name: Read version
        shell: pwsh
        run: |
          $v = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          if (-not $v) { throw 'could not read version from Cargo.toml' }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
      - name: Build installer
        shell: pwsh
        run: |
          $repoRoot = (Get-Location).Path
          $stage = Join-Path $repoRoot "dist\yutu-mux-$env:APP_VERSION-windows-x86_64\yutu-mux-$env:APP_VERSION-windows-x86_64"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion="$env:APP_VERSION" /DStageDir="$stage" /O"dist\output" /F"YutuMux-$env:APP_VERSION-windows-x86_64-Setup" packaging\windows\YutuMux.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          $setup = "dist\output\YutuMux-$env:APP_VERSION-windows-x86_64-Setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          Set-Content "$setup.sha256" "$hash  $(Split-Path $setup -Leaf)`n" -NoNewline
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/*.zip
            dist/*/*.zip.sha256
            dist/output/*.exe
            dist/output/*.exe.sha256
