name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  linux-tarball:
    name: linux x86_64 tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps (ALSA for rodio/cpal, Wayland+X11 for iced/winit, libmpv for mpv backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libx11-dev libwayland-dev libxkbcommon-dev libmpv-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace --locked
      - name: Feature checks (innertube + submit + mpv compile)
        run: |
          cargo check --workspace --all-features --locked
          pkg-config --modversion mpv
          cargo check -p yutu-player --features mpv --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Package portable tarball
        run: |
          set -eu
          STAGE="stage/yutu-mux-x86_64-unknown-linux-gnu"
          mkdir -p "$STAGE"
          cp target/release/yutu-mux "$STAGE/"
          cp README.md "$STAGE/"
          if test -f LICENSE; then cp LICENSE "$STAGE/"; fi
          cp flatpak/org.yutu_mux.YutuMux.yaml flatpak/org.yutu_mux.YutuMux.desktop "$STAGE/"
          cp -R packaging/linux/icons "$STAGE/icons"
          tar -czf yutu-mux-x86_64-unknown-linux-gnu.tar.gz -C stage yutu-mux-x86_64-unknown-linux-gnu
          sha256sum yutu-mux-x86_64-unknown-linux-gnu.tar.gz > yutu-mux-x86_64-unknown-linux-gnu.tar.gz.sha256
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yutu-mux-x86_64-unknown-linux-gnu.tar.gz
            yutu-mux-x86_64-unknown-linux-gnu.tar.gz.sha256
  macos-dmg:
    name: macOS arm64 disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deps (libmpv headers, dylibbundler for the self-contained bundle)
        run: brew install mpv pkg-config dylibbundler
      - uses: dtolnay/rust-toolchain@stable
      - name: Build self-contained app and disk image
        run: packaging/macos/build-app.sh --self-contained --output dist
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
