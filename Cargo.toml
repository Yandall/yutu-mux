[package]
name = "yutu-mux"
version = "0.1.0"
edition = "2021"
description = "Native Rust YouTube Music desktop app (Iced, Linux + macOS)"
license = "MIT"

[[bin]]
name = "yutu-mux"
path = "src/main.rs"

[workspace]
members = [
    "crates/yutu-core",
    "crates/yutu-player",
    "crates/yutu-ui",
    "crates/yutu-desktop",
]

[dependencies]
yutu-core = { path = "crates/yutu-core" }
yutu-player = { path = "crates/yutu-player" }
yutu-ui = { path = "crates/yutu-ui" }
yutu-desktop = { path = "crates/yutu-desktop" }
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "signal"] }

[profile.release]
lto = true
strip = true
