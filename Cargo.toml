[package]
name = "yutu-mux"
version = "0.1.0"
edition = "2021"
description = "Native Rust YouTube Music desktop app (Iced, Linux + macOS)"
license = "MIT"

[[bin]]
name = "yutu-mux"
path = "src/main.rs"

[workspace]
members = [
    "crates/yutu-core",
    "crates/yutu-player",
    "crates/yutu-ui",
    "crates/yutu-desktop",
]

[dependencies]
yutu-core = { path = "crates/yutu-core" }
yutu-player = { path = "crates/yutu-player" }
yutu-ui = { path = "crates/yutu-ui" }
yutu-desktop = { path = "crates/yutu-desktop" }
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "signal"] }
# Prompt page return on free (the system allocator retains freed spans,
# which inflates the macOS footprint long after the churn that made
# them; only Rust allocations route here, libmpv/ffmpeg keep theirs).
mimalloc = "0.1"

# Build script input, used only when TARGET contains `windows` (the gate
# lives in build.rs via the TARGET env var, because a build script
# compiles for the host and `cfg(windows)` would miss cross builds).
# Unconditional so the script source resolves on every host; MSVC needs
# rc.exe, MinGW cross builds need x86_64-w64-mingw32-windres.
[build-dependencies]
winres = "0.1"

[features]
# Forwarded to yutu-ui (the binary itself has no code-gated code):
# `cargo run --features debug-panel` from the workspace root.
debug-panel = ["yutu-ui/debug-panel"]

[profile.release]
lto = true
strip = true
